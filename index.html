<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Shivam Jewels | 3D WebAR Experience</title>
  <meta name="description" content="Official WebAR experience for Shivam Jewels." />

  <!-- OpenGraph -->
  <meta property="og:title" content="Shivam Jewels | 3D WebAR Experience" />
  <meta property="og:description"
    content="Scan the Shivam Jewels card to launch interactive 3D WebAR directly in your mobile browser." />
  <meta property="og:url" content="https://ar.testsjit.in" />

  <!-- Fonts & Icons -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Cinzel:wght@500;600;700&display=swap"
    rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />

  <!-- Stylesheet -->
  <link rel="stylesheet" href="./css/styles.css?v=2.1.0" />

  <!-- A-Frame Library (v1.5.0) -->
  <script src="./js/aframe.min.js"></script>

  <!-- MindAR Image Library for A-Frame (v1.2.5) -->
  <script src="./js/mindar-image-aframe.prod.js"></script>

  <!-- Application Controller Script -->
  <script src="./js/app.js?v=2.1.0" defer></script>
</head>

<body>

  <!-- ==========================================================================
       1. SHIVAM JEWELS DIAMOND LOADING SCREEN
       ========================================================================== -->
  <div id="loading-screen" class="loading-screen">
    <div class="loading-content">
      <div class="loading-diamond-wrapper">
        <div class="loading-diamond-base"></div>
        <div class="loading-diamond-fill" id="diamond-fill"></div>
      </div>
    </div>
  </div>

  <!-- ==========================================================================
       2. MODE SELECTION MODAL (AR MODE and 3D MODE - SIDE BY SIDE)
       ========================================================================== -->
  <div id="mode-selection-modal" class="modal-overlay hidden">
    <div class="modal-card mode-select-modal-card">
      <div class="modal-logo-wrapper">
        <i class="fas fa-layer-group"></i>
      </div>
      <h2 class="modal-title">Select Mode</h2>
      <p class="modal-subtitle">Shivam Jewels AR</p>

      <div class="mode-options-row">
        <!-- Option 1: AR Mode -->
        <button class="mode-btn-card" id="btn-choose-ar" onclick="handleSelectMode('AR')">
          <div class="mode-btn-icon">
            <i class="fas fa-vr-cardboard"></i>
          </div>
          <span class="mode-btn-title">AR Mode</span>
          <span class="mode-btn-sub">SJ AR Card</span>
        </button>

        <!-- Option 2: 3D Mode -->
        <button class="mode-btn-card" id="btn-choose-3d" onclick="handleSelectMode('THREED')">
          <div class="mode-btn-icon">
            <i class="fas fa-cube"></i>
          </div>
          <span class="mode-btn-title">3D Mode</span>
          <span class="mode-btn-sub">SJ 3D Card</span>
        </button>
      </div>
    </div>
  </div>

  <!-- ==========================================================================
       3. TOP BAR
       ========================================================================== -->
  <header id="app-header">
    <!-- Status Pill Indicator (Left) -->
    <div id="status-pill" class="status-pill searching">
      <div class="status-dot"></div>
      <span id="status-text">Scan SJ AR Card</span>
    </div>

    <!-- Mode Switcher & Reset Button (Center) -->
    <button id="btn-switch-mode" class="header-mode-btn" onclick="handleOpenModeSelect()"
      title="Switch Experience Mode">
      <i class="fas fa-sliders-h"></i>
      <span id="current-mode-label">Mode</span>
    </button>

    <!-- Brand Logo (Right Corner, Pure White) -->
    <div class="brand-badge">
      <img src="./assets/AR/shivam_logo.png" alt="Shivam Jewels Logo" class="brand-badge-logo" />
    </div>
  </header>

  <!-- ==========================================================================
       4. SCANNING RETICLE & TARGET GUIDANCE
       ========================================================================== -->
  <div id="scanning-reticle">
    <!-- Transparent Shivam Jewels Full Invitation Card Target Preview -->
    <div class="qr-target-preview-wrapper">
      <img src="./assets/cards/targets.png" alt="Shivam Jewels Card Preview" class="qr-target-preview-img" />
    </div>

    <!-- Single Clean Helper Text -->
    <div class="scanning-label" id="scanning-label-text">
      Point camera at SJ AR Card
    </div>
  </div>

  <!-- ==========================================================================
       5. 3D GESTURE INTERACTION HINT (FOR 3D MODE)
       ========================================================================== -->
  <div id="gesture-hint" class="gesture-hint hidden">
    <i class="fas fa-hand-pointer"></i>
    <span>Drag anywhere to rotate 3D view</span>
  </div>

  <!-- ==========================================================================
       6. MAIN A-FRAME SCENE CONTAINER (AR & 3D MODES)
       ========================================================================== -->
  <a-scene id="ar-scene"
    mindar-image="imageTargetSrc: ./assets/targets.mind; autoStart: false; uiScanning: no; uiLoading: no; filterMinCF: 0.0001; filterBeta: 0.001; missTolerance: 12;"
    color-space="sRGB"
    renderer="colorManagement: true; physicallyCorrectLights: true; exposure: 1.35; alpha: true; sortTransparentObjects: true; antialias: true;"
    vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false" embedded>

    <a-assets>
      <!-- ====================================================================
           1. AR MODE ASSETS (ORIGINAL AR DECLARATIONS)
           ==================================================================== -->
      <!-- Load 3D GLB Gem Ring Model asset -->
      <a-asset-item id="glbRing" src="./assets/glb/Ring.glb"></a-asset-item>
      <!-- Load 3D GLB Shivam Avatar Model asset -->
      <a-asset-item id="glbShivam" src="./assets/glb/Shivam.glb"></a-asset-item>
      <!-- Load Shivam Jewels Thank You Banner Image asset -->
      <img id="shivamBanner" src="./assets/AR/shivam_banner.png" />
      <!-- Load Shivam Jewels Official Logo Image asset -->
      <img id="shivamLogo" src="./assets/AR/shivam_logo.png" />
      <!-- Load Shivam Jewels Booth Target Image asset -->
      <img id="Booth" src="./assets/AR/Booth.png" />

      <!-- ====================================================================
           2. 3D MODE ASSETS (EASILY SWAP/REPLACE INDEPENDENTLY FROM AR)
           ==================================================================== -->
      <!-- Load 3D Mode GLB Gem Ring Model asset -->
      <a-asset-item id="glbRing-3d" src="./assets/glb/Ring.glb"></a-asset-item>
      <!-- Load 3D Mode GLB Shivam Avatar Model asset -->
      <a-asset-item id="glbShivam-3d" src="./assets/glb/Shivam.glb"></a-asset-item>
      <!-- Load 3D Mode Shivam Jewels Thank You Banner Image asset -->
      <img id="shivamBanner-3d" src="./assets/AR/shivam_banner.png" />
      <!-- Load 3D Mode Shivam Jewels Official Logo Image asset -->
      <img id="shivamLogo-3d" src="./assets/AR/shivam_logo.png" />
      <!-- Load 3D Mode Shivam Jewels Booth Target Image asset -->
      <img id="Booth-3d" src="./assets/AR/Booth.png" />
    </a-assets>

    <!-- Camera setup with 0 0 0 position -->
    <a-camera id="main-camera" position="0 0 0" look-controls="enabled: false"></a-camera>

    <!-- ========================================================================
         A. AR EXPERIENCE TARGET (MINDAR IMAGE TRACKED - CONTINUOUS)
         ======================================================================== -->
    <a-entity id="ar-target" mindar-image-target="targetIndex: 0">

      <!-- Multi-Angle Lighting for Maximum Gem Reflection & Visibility -->
      <a-entity light="type: ambient; color: #ffffff; intensity: 3.0"></a-entity>
      <a-entity light="type: directional; color: #ffffff; intensity: 3.8" position="1 3 4"></a-entity>
      <a-entity light="type: directional; color: #82b2df; intensity: 2.2" position="-2 1 3"></a-entity>
      <a-entity light="type: point; color: #ffffff; intensity: 3.5; distance: 6" position="0 0.5 1"></a-entity>

      <!-- Wrapped AR 3D Experience Content -->
      <a-entity id="ar-content-wrapper" visible="false" scale="0 0 0"
        animation="property: scale; from: 0 0 0; to: 1 1 1; dur: 800; easing: easeOutBack; startEvents: targetFound">

        <!-- 1. Shivam Jewels Booth (Left side) -->
        <a-plane id="booth-plane" src="#Booth" position="-1.3 0 -1" rotation="0 15 0" width="1.0" height="1.25"
          material="transparent: true; alphaTest: 0.2; side: double; shader: flat; depthTest: true;">
        </a-plane>

        <!-- 2. Shivam Jewels Banner (Right side) -->
        <a-plane id="banner-plane" src="#shivamBanner" position="1.3 0 -1" rotation="0 -15 0" width="1.0" height="1.25"
          material="transparent: true; alphaTest: 0.2; side: double; shader: flat; depthTest: true;">
        </a-plane>

        <!-- 3. Shivam Jewels Official Logo (Center Top) -->
        <a-plane id="logo-plane" src="#shivamLogo" position="0 0.8 0" rotation="0 0 0" width="1.0" height="0.26"
          material="transparent: true; alphaTest: 0.2; side: double; shader: flat; depthTest: true;">
        </a-plane>

        <!-- 4. Center Bottom: Flat Gem Ring Pedestal -->
        <a-entity id="ring-model-container" position="0 -0.5 0.2" rotation="0 0 0">
          <a-gltf-model id="ring-model-entity" src="#glbRing" scale="0.2 0.2 0.2" position="0 0 0" rotation="0 0 0"
            play-all-animations>
          </a-gltf-model>
        </a-entity>

        <!-- 5. Center: Shivam 3D Model Showcase -->
        <a-entity id="shivam-model-container" position="0 -0.4 0.2" rotation="0 -90 0">
          <a-gltf-model id="shivam-model-entity" src="#glbShivam" scale="3 3 3" position="0 0 0" rotation="0 0 0"
            play-all-animations>
          </a-gltf-model>
        </a-entity>
      </a-entity>

    </a-entity>

    <!-- ========================================================================
         B. 3D PERSISTENT ENVIRONMENT (ONE-TIME SCAN UNLOCK)
         Positioned in front of camera (Z = -2.5) with touch-rotate interaction
         ======================================================================== -->
    <a-entity id="threed-world-pivot" position="0 0 0" rotation="0 0 0">

      <!-- Studio Lighting for 3D Mode -->
      <a-entity light="type: ambient; color: #ffffff; intensity: 3.2"></a-entity>
      <a-entity light="type: directional; color: #ffffff; intensity: 4.0" position="1 4 3"></a-entity>
      <a-entity light="type: directional; color: #cbe2f8; intensity: 2.5" position="-3 2 2"></a-entity>
      <a-entity light="type: point; color: #c9a96e; intensity: 2.0; distance: 5" position="0 -1 1"></a-entity>

      <!-- Wrapped 3D Mode Content (Mirrored Structure for easy asset replacement) -->
      <a-entity id="threed-content-wrapper" visible="false" position="0 0 -2.5" scale="0 0 0" touch-rotate>

        <!-- 1. Shivam Jewels Booth 3D (Left side) -->
        <a-plane id="booth-plane-3d" src="#Booth-3d" position="-1.3 0 -1" rotation="0 15 0" width="1.0" height="1.25"
          material="transparent: true; alphaTest: 0.2; side: double; shader: flat; depthTest: true;">
        </a-plane>

        <!-- 2. Shivam Jewels Banner 3D (Right side) -->
        <a-plane id="banner-plane-3d" src="#shivamBanner-3d" position="1.3 0 -1" rotation="0 -15 0" width="1.0"
          height="1.25" material="transparent: true; alphaTest: 0.2; side: double; shader: flat; depthTest: true;">
        </a-plane>

        <!-- 3. Shivam Jewels Official Logo 3D (Center Top) -->
        <a-plane id="logo-plane-3d" src="#shivamLogo-3d" position="0 0.8 0" rotation="0 0 0" width="1.0" height="0.26"
          material="transparent: true; alphaTest: 0.2; side: double; shader: flat; depthTest: true;">
        </a-plane>

        <!-- 4. Center Bottom: Flat Gem Ring Pedestal 3D -->
        <a-entity id="ring-model-container-3d" position="0 -0.5 0.2" rotation="0 0 0">
          <a-gltf-model id="ring-model-entity-3d" src="#glbRing-3d" scale="0.2 0.2 0.2" position="0 0 0"
            rotation="0 0 0" play-all-animations>
          </a-gltf-model>
        </a-entity>

        <!-- 5. Center: Shivam 3D Model Showcase 3D -->
        <a-entity id="shivam-model-container-3d" position="0 -0.4 0.2" rotation="0 -90 0">
          <a-gltf-model id="shivam-model-entity-3d" src="#glbShivam-3d" scale="3 3 3" position="0 0 0" rotation="0 0 0"
            play-all-animations>
          </a-gltf-model>
        </a-entity>
      </a-entity>

    </a-entity>

  </a-scene>

  <!-- ==========================================================================
       7. CAMERA PERMISSION & GUIDANCE MODAL
       ========================================================================== -->
  <div id="permission-modal" class="modal-overlay hidden">
    <div class="modal-card">
      <div id="modal-icon" class="modal-logo-wrapper">
        <i class="fas fa-camera"></i>
      </div>
      <h2 id="modal-title" class="modal-title">Camera Access Needed</h2>
      <p class="modal-subtitle">Shivam Jewels AR</p>
      <p id="modal-desc" class="modal-desc">
        Camera permission is needed to scan the SJ card and launch the experience.
      </p>

      <!-- Dynamic Camera Error & Site Settings Guide Box -->
      <div id="camera-error" class="camera-error-box"></div>

      <div class="modal-actions">
        <button id="btn-start-ar" class="btn-primary-lg" onclick="handleStartARClick(event)">
          <i class="fas fa-video" id="btn-icon"></i> <span id="btn-text">Enable Camera</span>
        </button>
      </div>
    </div>
  </div>

</body>

</html>
