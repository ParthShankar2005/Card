<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>3D WebAR Experience | card.shivamai.studio</title>
  <meta name="description"
    content="100% free app-less WebAR experience powered by MindAR.js and A-Frame on card.shivamai.studio" />

  <!-- OpenGraph -->
  <meta property="og:title" content="3D WebAR Experience | card.shivamai.studio" />
  <meta property="og:description"
    content="Scan the tracking target to launch interactive 3D WebAR directly in your mobile browser." />
  <meta property="og:url" content="https://card.shivamai.studio" />

  <!-- Fonts & Icons -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />

  <!-- Stylesheet -->
  <link rel="stylesheet" href="./css/styles.css?v=1.0.2" />

  <!-- A-Frame Library (v1.5.0) -->
  <script src="./js/aframe.min.js"></script>

  <!-- MindAR Image Library for A-Frame (v1.2.5) -->
  <script src="./js/mindar-image-aframe.prod.js"></script>

  <!-- Application Controller Script -->
  <script src="./js/app.js?v=1.0.4" defer></script>
</head>

<body>

  <!-- Top Glassmorphic Navigation & Status Bar -->
  <header id="app-header" class="glass-panel">
    <div class="brand-badge">
      <i class="fas fa-gem" style="color: #38bdf8;"></i>
      <span>Shivam Jewels</span>
    </div>
    <div id="status-pill" class="status-pill searching">
      <div class="status-dot"></div>
      <span id="status-text">Scanning Target...</span>
    </div>
  </header>

  <!-- Camera Reticle & Translucent Target Overlay -->
  <div id="scanning-reticle" class="hidden">
    <div class="reticle-corner reticle-top-left"></div>
    <div class="reticle-corner reticle-top-right"></div>
    <div class="reticle-corner reticle-bottom-left"></div>
    <div class="reticle-corner reticle-bottom-right"></div>

    <!-- Transparent Shivam Jewels Full Invitation Card Target Preview -->
    <div class="qr-target-preview-wrapper">
      <img src="./assets/targets.png" alt="Shivam Jewels Target Preview" class="qr-target-preview-img" />
    </div>

    <div class="reticle-line"></div>
    <div class="scanning-label">
      <i class="fas fa-camera"></i> Point Camera at Shivam Jewels Card Target
    </div>
  </div>

  <!-- Main WebAR Scene Container -->
  <a-scene id="ar-scene"
    mindar-image="imageTargetSrc: ./assets/targets.mind; autoStart: false; uiScanning: no; uiLoading: no; filterMinCF: 0.0001; filterBeta: 0.001; missTolerance: 12;"
    color-space="sRGB"
    renderer="colorManagement: true; physicallyCorrectLights: true; exposure: 1.25; alpha: true; sortTransparentObjects: true;"
    vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false" embedded>

    <a-assets>
      <!-- Load 3D GLB Gem Model asset -->
      <a-asset-item id="glbModel" src="./assets/Shivam.glb?v=1"></a-asset-item>
      <!-- Load Shivam Jewels Thank You Banner Image asset -->
      <img id="shivamBanner" src="./assets/shivam_banner.png" />
      <!-- Load Shivam Jewels Official Logo Image asset -->
      <img id="shivamLogo" src="./assets/shivam_logo.png" />
      <!-- Load Shivam Jewels Card Back Image asset -->
      <img id="cardBack" src="./assets/Shivam_Jewels_Card_Back.png" />
      <!-- Load Shivam Jewels QR View Card Back Image asset -->
      <img id="qrView" src="./assets/QR%20view.png" />
      <!-- Load Shivam Jewels Booth Target Image asset -->
      <img id="Booth" src="./assets/Booth.png" />
    </a-assets>

    <!-- Camera setup -->
    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

    <!-- Target 0: Image Target tracking anchor -->
    <a-entity id="ar-target" mindar-image-target="targetIndex: 0">

      <!-- Multi-Angle Lighting for Maximum Gem Reflection & Visibility -->
      <a-entity light="type: ambient; color: #ffffff; intensity: 3.0"></a-entity>
      <a-entity light="type: directional; color: #ffffff; intensity: 3.8" position="1 3 4"></a-entity>
      <a-entity light="type: directional; color: #38bdf8; intensity: 2.2" position="-2 1 3"></a-entity>
      <a-entity light="type: point; color: #ffffff; intensity: 3.5; distance: 6" position="0 0.5 1"></a-entity>

      <!-- Wrapped 3D Experience Content -->
      <a-entity id="ar-content-wrapper" visible="false" scale="0 0 0"
        animation="property: scale; from: 0 0 0; to: 1 1 1; dur: 800; easing: easeOutBack; startEvents: targetFound">
        <!-- 1. Shivam Jewels Card Back (Scaled to match tracking target width of 1.0) -->
        <a-plane id="card-back-plane" src="#Booth" position="0 0 0" rotation="0 0 0" width="1.0" height="0.93"
          material="transparent: true; alphaTest: 0.2; side: double; shader: flat; depthTest: true;">
        </a-plane>

        <!-- 2. Shivam Jewels Banner (Scaled and positioned on RIGHT side of card back) -->
        <a-plane id="banner-plane" src="#shivamBanner" position="1.2 0 0" rotation="0 -20 0" width="1.0" height="1.45"
          material="transparent: true; alphaTest: 0.2; side: double; shader: flat; depthTest: true;">
        </a-plane>

        <!-- 3. Shivam Jewels Official Logo (Scaled and positioned above the card header) -->
        <a-plane id="logo-plane" src="#shivamLogo" position="0 1 0" rotation="0 0 0" width="1.0" height="0.26"
          material="transparent: true; alphaTest: 0.2; side: double; shader: flat; depthTest: true;">
        </a-plane>

        <!-- 4. Authentic 3D Diamond Ring Showcase (Upright & Floating in Front of Card) -->
        <a-entity id="3d-model-container" position="0 0 0.25" rotation="90 0 0">
          <a-gltf-model id="3d-model-entity" src="#glbModel" scale="0.1 0.1 0.1" position="0 0 0" rotation="0 0 0"
            play-all-animations>
          </a-gltf-model>
        </a-entity>
      </a-entity>

    </a-entity>
  </a-scene>

  <!-- Camera Permission & Welcome Modal -->
  <div id="permission-modal" class="modal-overlay">
    <div class="modal-card glass-panel">
      <div id="modal-icon" class="modal-icon">
        <i class="fas fa-gem"></i>
      </div>
      <h2 id="modal-title" class="modal-title">Shivam Jewels WebAR</h2>
      <p id="modal-desc" class="modal-desc">
        Point your mobile camera at the Shivam Jewels card target to launch the interactive 3D WebAR showcase.
      </p>

      <!-- Dynamic Camera Error Alert Box -->
      <div id="camera-error" class="camera-error-box"></div>

      <div class="modal-actions">
        <button id="btn-start-ar" class="btn-pill btn-primary-lg" onclick="handleStartARClick(event)">
          <i class="fas fa-video" id="btn-icon"></i> <span id="btn-text">Allow Camera & Start WebAR</span>
        </button>
      </div>
    </div>
  </div>

</body>

</html>
